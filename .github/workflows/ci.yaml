---
name: Build Pipeline

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

# One run at a time per ref. cancel-in-progress is deliberately false: cancelling
# a packer build kills the runner without giving packer time to terminate its EC2
# build instance, orphaning a t3.medium plus its temporary security group and key
# pair. A queued run is cheaper than a leaked instance.
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: false

jobs:
  security-run:
    name: Security Checks (Run)

    runs-on: ubuntu-latest

    steps:
      # https://github.com/actions/checkout
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # https://github.com/actions/setup-go
      - name: Setup Golang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      # https://github.com/securego/gosec
      - name: Run GoSec (Golang code issues)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@master
          gosec -stdout ./...

  security-docker:
    name: Security Checks (Docker)

    runs-on: ubuntu-latest

    env:
      GO111MODULE: on

    steps:
      # https://github.com/actions/checkout
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # https://github.com/actions/setup-go
      - name: Setup Golang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      # https://github.com/securego/gosec
      - name: Run Gosec Security Scanner
        uses: securego/gosec@5eb1d104ef85ff2c905c877eb600e8c1dee33a22 # v2.30.0
        with:
          args: ./...