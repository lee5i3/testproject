---
name: Build Pipeline

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

# One run at a time per ref. cancel-in-progress is deliberately false: cancelling
# a packer build kills the runner without giving packer time to terminate its EC2
# build instance, orphaning a t3.medium plus its temporary security group and key
# pair. A queued run is cheaper than a leaked instance.
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: false

jobs:
  create-release:
    name: Create Release

    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.set-version.outputs.version }}
    
    if: github.ref == ${{ github.event.repository.default_branch }}
    
    permissions:
      contents: read

    steps:
      - name: Create release
        run: 
          echo "I'm create a release"

      - name: Set output
        id: set-version
        run: echo "version=1.0.0" >> $GITHUB_OUTPUT

  build:
    name: Build Docker
    needs: [create-release]

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Build docker image
        run: |
          echo "Building Docker image: ${{ needs.create-release.outputs.version }}"