name: Test Permissions

on:
  # Run on main to catch any issues introduced after merge
  push:

  # Run on pull requests to main to catch any issues before merge
  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  pat:
    name: Test Permissions for PAT
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check permissions
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          GITHUB_TOKEN=${GITHUB_TOKEN} gh auth status

      - name: Permission test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh search prs --owner lee5i3


  test-permissions:
    name: Test Permissions
    runs-on: ubuntu-latest
    steps:
      - name: Check permissions
        run: |
          echo "Permissions for GITHUB_TOKEN:"
          echo "  contents: ${{ github.token.permissions }}"          

  test-permissions-contents:
    name: Test Permissions for Contents
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check permissions
        run: |
          echo "Permissions for GITHUB_TOKEN:"
          echo "  contents: ${{ github.token.permissions }}"
