name: Test Permissions

on:
  # Run on main to catch any issues introduced after merge
  push:

  # Run on pull requests to main to catch any issues before merge
  pull_request:

  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test-permissions:
    name: Test Permissions
    runs-on: ubuntu-latest
    steps:
      - name: Check permissions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Permissions for GITHUB_TOKEN:"
          echo "  contents: ${{ github.token.permissions.contents }}"          
          curl -sS -f -I -H "Authorization: token ${GITHUB_TOKEN}" https://api.github.com | grep ^x-oauth-scopes: | cut -d' ' -f2- | tr -d "[:space:]" | tr ',' '\n'

