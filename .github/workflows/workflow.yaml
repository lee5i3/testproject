name: Test reusable workflow

on:
  workflow_call:
    secrets:
      github-token:
        required: false

permissions:
  contents: read

jobs:
  pat:
    name: Test Permissions for PAT
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # pull-requests: write
    steps:
      - name: Check permissions
        env:
          GITHUB_TOKEN: ${{ secrets.github-token }}
        run: |
          GITHUB_TOKEN=${GITHUB_TOKEN} gh auth status

