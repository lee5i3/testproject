name: Test reusable workflow

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  pat:
    name: Test Permissions for PAT
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # pull-requests: write
    steps:

      - name: Approve the pull request
        run: |
          gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}